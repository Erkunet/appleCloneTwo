<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apple Clone</title>

    <link rel="icon" href="images/icons/favicon.ico" type="image/x-icon" />

    <!-- Link to the Font-Awesome Font -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.2/css/font-awesome.min.css" />

    <!-- Link to Montserrat font from Google Fonts-->
    <link
        href="https://fonts.googleapis.com/css?family=Montserrat:200,200i,300,300i,400,600,600i,700,700i,800,800i,900,900i&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="../appleCloneTwo/bootstrap.css">
    <link rel="stylesheet" href="../appleCloneTwo/style.css">


</head>

<body>

    <header>
        <!-- Header will be added here -->
    </header>

    <main>

        <!-- First section -->
        <section class="main-highlight-wrapper text-center py-5">
            <div class="container">

                <p class="model text-muted mt-4 mb-0">16-inch model</p>
                <h1 class="product-title fw-bold mb-0"> MacBook Pro </h1>
                <p class="brief-description fs-4 fw-semibold"> The best for the brightest. </p>

                <div class="links-wrapper text-center">
                    <ul class="d-flex gap-4 list-unstyled justify-content-center">
                        <li><a href="#" class=" btn btn-primary rounded-pill px-4 py-2 text-center ">Learn more</a></li>
                        <li><a href="#"
                                class="text-decoration-none btn btn-outline-primary rounded-pill px-4 py-2 ">Buy</a>
                        </li>
                    </ul>
                </div>
                <div class="main-image-wrapper mb-0">
                    <img src="../appleCloneTwo/images/mac-laptop.jpg" alt="MacBook Pro Image" />
                </div>

            </div>
        </section>

        <!-- Second section -->
        <section class="second-highlight-wrapper text-center py-4">
            <div class="internal-wrapper">
                <div class="product-title-wrapper fs-1 fw-bold text-white">iphone 11 Pro</div>
                <div class="description-wrapper text-white fs-6 fw-semibold">Pro cameras. Pro display. Pro performance
                </div>
                <div class="price-wrapper fs-6 text-secondary gray-600: #6c757d">From $24.95/mo. or $599 with trade-in.
                </div>
                <div class="links-wrapper py-2 text-center">
                    <ul class="list-unstyled d-flex justify-content-center gap-3">
                        <li><a href="#" class="text-decoration-none btn btn-primary rounded-pill px-4 py-2 ">Learn
                                more</a></li>
                        <li><a href="#"
                                class="text-decoration-none btn btn-outline-primary rounded-pill px-4 py-2 ">Buy</a>
                        </li>
                    </ul>
                </div>
            </div>
        </section>


        <!-- Third section -->
        <section class="iphone-11"></section>

        <!-- Fourth section -->
        <section class="fourth-section"></section>

        <!-- Fifth section -->
        <section class="fifth-section"></section>

        <!-- Sixth section -->
        <section class="sixth-section"></section>

    </main>

    <footer>
        <!-- Footer will be added here -->
    </footer>

</body>

</html>
